services:
  phpccdae:
    image: ccdae-app:local
    container_name: php-ccdae
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./storage/app/public:/var/www/html/public/storage
      - ./docker/php.ini:/usr/local/etc/php/conf.d/docker-php.ini
      - ../geoveil:/var/www/packages/geoveil
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    restart: always

  nginx:
    ports:
      - 8787:80
    container_name: nginx-ccdae
    image: nginx
    hostname: ccdae.container
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./storage/app/public:/var/www/html/public/storage
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - phpccdae
      - martin
    networks:
      - default
    restart: always

  queue:
    image: ccdae-app:local
    command: sh -c "php artisan queue:work --sleep=3 --tries=2 --timeout=300 2>&1 | tee -a storage/logs/queue-worker.log"
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./docker/php.ini:/usr/local/etc/php/conf.d/docker-php.ini
      - ../geoveil:/var/www/packages/geoveil
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  scheduler:
    image: ccdae-app:local
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./docker/php.ini:/usr/local/etc/php/conf.d/docker-php.ini
      - ../geoveil:/var/www/packages/geoveil
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  martin:
    image: ghcr.io/maplibre/martin:1.13.0
    container_name: martin-ccdae
    command: ["--config", "/config/config.yaml"]
    environment:
      MARTIN_DATABASE_URL: ${MARTIN_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/data}
    volumes:
      - ./docker/martin/config.yaml:/config/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    restart: always

  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: postgres-ccdae
    ports:
      - "5532:5432"
    environment:
      POSTGRES_DB: data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d data"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - default
    restart: always

networks:
  default:
    name: rede_local
    external: true

volumes:
  postgres_data:
