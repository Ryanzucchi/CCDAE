proxy_cache_path /var/cache/nginx/ccdae-tiles-v4
                 levels=1:2
                 keys_zone=ccdae_tiles_v4:10m
                 max_size=2g
                 inactive=1h
                 use_temp_path=off;

server {
    listen 80;
    server_name ccdae.local;

    root /var/www/html/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /tiles/ {
        rewrite ^/tiles/(.*)$ /$1 break;

        proxy_set_header X-Rewrite-URL $uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;

        proxy_cache ccdae_tiles_v4;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_valid 200 204 1m;
        proxy_cache_valid 404 15s;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://martin:3000;
    }

    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass phpccdae:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
    }
}
